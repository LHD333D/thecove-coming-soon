<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Cove — Coming Soon</title>
  <meta name="description" content="The Cove is coming soon.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      color: #e7c36a;
      overflow: hidden;
      padding: 24px;
    }

    main {
      width: 100%;
      text-align: center;
    }

    .logo {
      display: block;
      width: auto;
      height: auto;
      max-width: min(88vw, 600px);
      max-height: 68svh;
      object-fit: contain;
      margin: 0 auto;
    }

    .coming-soon {
      margin: 14px 0 0;
      font-family: "Cinzel", Georgia, "Times New Roman", serif;
      font-size: clamp(22px, 3vw, 36px);
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      background: linear-gradient(
        180deg,
        #fff5bf 0%,
        #e9bd55 36%,
        #fff1a0 56%,
        #b98628 78%,
        #f6d878 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 16px rgba(236, 193, 87, 0.15);
    }

    @media (max-width: 600px) {
      body { padding: 16px; }
      .logo {
        max-width: 94vw;
        max-height: 62svh;
      }
      .coming-soon {
        margin-top: 10px;
        letter-spacing: 0.16em;
      }
    }
  </style>
</head>

<body>
  <main>
    <img class="logo" src="logo.png" alt="The Cove">
    <div class="coming-soon">Coming Soon</div>
  </main>
</body>
</html>
